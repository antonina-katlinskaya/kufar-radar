name: Optimize new D1 price alerts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply price-alert indexes to new D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          NEW_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request

          sql = pathlib.Path('migrations/new_d1_price_alert_indexes.sql').read_text()
          url = (
              f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}"
              f"/d1/database/{os.environ['NEW_D1_DATABASE_ID']}/query"
          )
          req = urllib.request.Request(
              url,
              data=json.dumps({'sql': sql}).encode(),
              headers={
                  'Authorization': 'Bearer ' + os.environ['CF_D1_API_TOKEN'],
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              body = json.loads(response.read())
          if not body.get('success'):
              raise SystemExit(body)

          results = body.get('result') or []
          rows_read = sum(int((r.get('meta') or {}).get('rows_read') or 0) for r in results)
          rows_written = sum(int((r.get('meta') or {}).get('rows_written') or 0) for r in results)
          print(f'NEW_D1_INDEXES_OK statements={len(results)} rows_read={rows_read} rows_written={rows_written}')
          PY
