name: Read-only BIR domain compatibility probe
on:
  push:
    branches:
      - fix/birby-domain-migration-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the staged collector syntax
        run: node --check bir-history/worker.mjs
      - name: Probe old and new domains without database writes
        run: node scripts/probe-bir-domains.mjs
