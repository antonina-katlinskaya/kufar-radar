name: Read-only BIR domain compatibility probe
on:
  push:
    branches:
      - fix/birby-domain-migration-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the staged collector syntax
        run: node --check bir-history/worker.mjs
      - name: Probe old and new domains without database writes
        run: node scripts/probe-bir-domains.mjs
      - name: Compare new domain to existing D1 history without modifying data
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BIR_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: node scripts/validate-bir-history-readonly.mjs
