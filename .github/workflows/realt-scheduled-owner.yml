name: Realt scheduled owner-only
on:
  schedule:
    # Cheap GitHub-only freshness checks; full audit only once per new collector snapshot.
    - cron: '8,18,28,38,48,58 4-18 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/realt-scheduled-owner.yml'
  workflow_dispatch: {}
  workflow_run:
    workflows: ['Radar']
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: realt-owner-scheduled-single
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REALT_CONTINUOUS: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realt-private-test-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - name: Verify owner-only policy and durable GitHub state
        run: python -m unittest discover -s realt_test -p 'test_*.py' -v
      - name: Export the existing successful Bir refresh without scanning sources
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          BIR_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
          BIR_EXPORT_META_PATH: /tmp/realt-bir-scan.json
        run: python -m realt_test.bridge_bir
      - name: Check Realt listings and exported fresh Bir
        run: python -m realt_test.run
      - name: Preview only new reviews
        run: python -m realt_test.check_pending
      - name: Deliver to verified personal chat only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REALT_ACTIVATE_TWO: '1'
        run: python -m realt_test.notify
      - name: Report migration success or a paused check to owner
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REALT_JOB_STATUS: ${{ job.status }}
        run: python -m realt_test.health
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realt-scheduled-audit
          retention-days: 3
          path: |
            realt_test/diagnostics.json
            realt_test/notification_receipt.json
            realt_test/health_receipt.json
          if-no-files-found: ignore
