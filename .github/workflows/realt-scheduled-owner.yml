name: Realt scheduled owner-only
on:
  schedule:
    # Cheap GitHub-only freshness checks; full audit only once per new collector snapshot.
    - cron: '8,18,28,38,48,58 4-18 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/realt-scheduled-owner.yml'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: realt-owner-scheduled-single
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REALT_CONTINUOUS: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realt-private-test-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - name: Verify owner-only policy and durable GitHub state
        run: python -m unittest discover -s realt_test -p 'test_*.py' -v
      - name: Check Realt listings and exported fresh Bir
        run: python -m realt_test.run
      - name: Preview only new reviews
        run: python -m realt_test.check_pending
      - name: Deliver to verified personal chat only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m realt_test.notify
      - name: Report migration success or a paused check to owner
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REALT_JOB_STATUS: ${{ job.status }}
        run: python -m realt_test.health
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realt-scheduled-audit
          retention-days: 3
          path: |
            realt_test/results.json
            realt_test/pending_reviews.json
            realt_test/notification_receipt.json
            realt_test/health_receipt.json
          if-no-files-found: warn
