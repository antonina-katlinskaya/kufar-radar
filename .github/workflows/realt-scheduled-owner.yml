name: Realt scheduled owner-only
on:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/realt-scheduled-owner.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: realt-owner-scheduled-single
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: realt-private-test-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify owner-only policy
        run: python -m unittest discover -s realt_test -p 'test_*.py' -v
      - name: Check Realt listings and current Bir
        env:
          REALT_CONTINUOUS: '1'
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_HISTORY_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
        run: python -m realt_test.run
      - name: Preview only new reviews
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m realt_test.check_pending
      - name: Deliver to verified personal chat only
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m realt_test.notify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realt-scheduled-audit
          retention-days: 30
          path: |
            realt_test/results.json
            realt_test/results.csv
            realt_test/results.md
            realt_test/pending_reviews.json
            realt_test/notification_receipt.json
          if-no-files-found: warn
