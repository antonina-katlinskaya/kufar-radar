name: BIR queued technical alerts - morning delivery

on:
  push:
    branches: [main]
    paths:
      - 'notifications/bir_refresh_failure.py'
      - 'tests/test_bir_failure_quiet_hours.py'
      - '.github/workflows/bir-technical-morning.yml'
  workflow_dispatch:
  schedule:
    # 08:05 Europe/Minsk (UTC+3 year-round).
    - cron: '5 5 * * *'

permissions:
  contents: read

concurrency:
  group: bir-technical-alert-morning
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Minsk delivery boundaries
        run: python -m unittest discover -s tests -p 'test_bir_failure_quiet_hours.py'
      - name: Deliver only previously queued BIR failures to owner
        if: github.event_name != 'push'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python notifications/bir_refresh_failure.py --flush
