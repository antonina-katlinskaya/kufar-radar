name: Probe sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Probe Kufar and Bir
        env:
          KUFAR_PROFILE_ID: '11093294'
          KUFAR_PROFILE_URL: 'https://re.kufar.by/p/ooo-mezhdunarodnaya-rielterskaya-kompaniya-etazhi/11093294'
          BIR_SEARCH_URL: 'https://bir.by/search-by-parameters/'
          HEADLESS: '1'
        run: python -m radar.probe
