name: Probe sources
on:
  workflow_dispatch:
  push:
    paths:
      - 'radar/probe.py'
      - 'radar/collectors/**'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Probe Kufar and Bir
        env:
          KUFAR_PROFILE_ID: '11093294'
          KUFAR_PROFILE_URL: 'https://re.kufar.by/p/ooo-mezhdunarodnaya-rielterskaya-kompaniya-etazhi/11093294'
          BIR_SEARCH_URL: 'https://bir.by/search-by-parameters/'
          HEADLESS: '1'
        run: |
          mkdir -p diagnostics
          python -m radar.probe 2>&1 | tee diagnostics/latest_probe.txt
      - name: Save diagnostic result
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add diagnostics/latest_probe.txt
          git diff --cached --quiet || git commit -m "diagnostic: update latest source probe"
          git pull --rebase origin main
          git push
