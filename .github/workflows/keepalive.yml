name: Keep scheduled workflows alive
on:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Update heartbeat
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .radar-heartbeat
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .radar-heartbeat
          git diff --cached --quiet || git commit -m "chore: radar keepalive"
          git push
