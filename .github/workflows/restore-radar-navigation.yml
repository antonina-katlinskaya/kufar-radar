name: Restore radar navigation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['notifications/restore_radar_navigation.py']
permissions:
  contents: read
concurrency:
  group: restore-radar-navigation
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - name: Restore and verify owner and sister navigation
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: 43422bcb-fce7-4ddc-adc7-e9bf457f2837
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m notifications.restore_radar_navigation
