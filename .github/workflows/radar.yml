name: Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radar/**'
      - 'requirements.txt'
      - '.github/workflows/radar.yml'

permissions:
  contents: read

concurrency:
  group: kufar-bir-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Apply employee attribution migration
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          NEW_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          sql = pathlib.Path('migrations/kufar_employee_attribution_20260929.sql').read_text()
          url = (
              f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}"
              f"/d1/database/{os.environ['NEW_D1_DATABASE_ID']}/query"
          )
          req = urllib.request.Request(
              url,
              data=json.dumps({'sql': sql}).encode(),
              headers={
                  'Authorization': 'Bearer ' + os.environ['CF_D1_API_TOKEN'],
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              body=json.loads(response.read())
          if not body.get('success'):
              raise SystemExit(body)
          print('KUFAR_EMPLOYEE_ATTRIBUTION_MIGRATION_OK')
          PY
      - name: Run radar
        env:
          KUFAR_PROFILE_ID: '11093294'
          KUFAR_PROFILE_URL: 'https://re.kufar.by/p/ooo-mezhdunarodnaya-rielterskaya-kompaniya-etazhi/11093294'
          BIR_SEARCH_URL: 'https://bir.by/search-by-parameters/'
          BIR_REFRESH_MINUTES: '5'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          HEADLESS: '1'
          SEND_SCREENSHOTS: '0'
        run: python -m radar.main
