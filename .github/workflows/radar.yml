name: Radar

# Time-based Radar cadence is owned by the lightweight Cloudflare trigger.
# GitHub Actions remains callable manually and on relevant production pushes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radar/**'
      - 'requirements.txt'
      - '.github/workflows/radar.yml'

permissions:
  contents: read

concurrency:
  group: kufar-bir-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - name: Refresh BIR snapshot before comparison
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BIR_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          BIR_SKIP_IF_FRESH_MINUTES: '10'
        run: |
          for attempt in 1 2 3; do
            if node bir-history/run.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "BIR refresh failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Refresh Kufar bridge before comparison
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BIR_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          KUFAR_PRIORITY_PROFILES: '11093294,11077002,11080367,8517496,11162944,10704279'
        run: |
          for attempt in 1 2; do
            if node cloudflare-bridge/run.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Kufar bridge refresh failed after 2 attempts"
              exit 1
            fi
            sleep 15
          done
      - name: Run radar
        env:
          KUFAR_PROFILE_ID: '11093294'
          KUFAR_PROFILE_URL: 'https://re.kufar.by/p/ooo-mezhdunarodnaya-rielterskaya-kompaniya-etazhi/11093294'
          BIR_SEARCH_URL: 'https://bir.by/search-by-parameters/'
          BIR_REFRESH_MINUTES: '5'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          HEADLESS: '1'
          SEND_SCREENSHOTS: '0'
        run: python -m radar.main
