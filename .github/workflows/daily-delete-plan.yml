name: Daily Kufar Deletion Plan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/daily-delete-plan.yml']
  schedule:
    - cron: '0 3 * * *' # 06:00 Minsk (UTC+3)
permissions:
  contents: write
concurrency:
  group: kufar-daily-delete-plan
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build frozen daily plan from radar D1 (no deletions)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
          EXPECTED_PUBLICATIONS: '95'
        run: python daily_delete_plan.py
      - name: Commit new plan only
        run: |
          git config user.name 'kufar-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add exports/daily-delete/
          git diff --cached --quiet || (git commit -m 'Daily Kufar deletion candidates' && git push)
