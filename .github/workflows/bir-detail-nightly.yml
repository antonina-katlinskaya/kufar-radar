name: BIR full detail refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '13 0 * * *'
permissions:
  contents: read
concurrency:
  group: bir-detail-full-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache owner contact before a possible D1 quota pause
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: python notifications/bir_refresh_failure.py --prepare
      - name: Refresh every active BIR detail card
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          BIR_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
          BIR_REFRESH_ALL_DETAILS: '1'
        run: node bir-history/run.mjs
      - name: Compact obsolete source metadata and expire diagnostic logs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: python notifications/storage_maintenance.py
      - name: Notify owner if nightly maintenance failed
        if: failure()
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python notifications/bir_refresh_failure.py
