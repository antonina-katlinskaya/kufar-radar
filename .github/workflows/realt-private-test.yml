name: Realt private test (no Telegram)
on:
  push:
    branches: [realt-private-test-20261026]
    paths:
      - 'realt_test/**'
      - '.github/workflows/realt-private-test.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Historical Realt vs BIR analysis (never notify Telegram)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_HISTORY_D1_DATABASE_ID: 'd8dd0219-8070-4f48-980d-312eba26209e'
        run: python -m realt_test.run
      - name: Match verified employee identities by phones (read-only)\n        env:\n          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}\n          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}\n          CF_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e\n        run: python -m realt_test.identity\n      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realt-private-test-results
          path: |\n            realt_test/results.json\n            realt_test/identity_results.json
          if-no-files-found: warn
