name: Realt private test
on:
  push:
    branches: [realt-private-test-20261026]
    paths:
      - 'realt_test/**'
      - '.github/workflows/realt-private-test.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: realt-private-test
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/realt-private-test-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify isolated audit and owner-only delivery guards
        run: python -m unittest discover -s realt_test -p 'test_*.py' -v
      - name: Discover ten named employees (read-only)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
        run: python -m realt_test.discover
      - name: Read-only cross-platform identity evidence
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
        run: python -m realt_test.cross_identity
      - name: Historical Realt vs current BIR (read-only)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_HISTORY_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
        run: python -m realt_test.run
      - name: Calculate pending reviews (dry run, no state writes)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python -m realt_test.check_pending
      - name: Publish Realt — тест only to verified private owner
        if: github.event_name == 'workflow_dispatch'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m realt_test.notify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realt-private-test-results
          retention-days: 90
          path: |
            realt_test/results.json
            realt_test/results.csv
            realt_test/results.md
            realt_test/pending_reviews.json
            realt_test/proposed_review_state.json
            realt_test/notification_receipt.json
          if-no-files-found: warn
