name: Realt private test
on:
  push:
    branches: [realt-private-test-20261026]
    paths:
      - 'realt_test/**'
      - '.github/workflows/realt-private-test.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: realt-private-test
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/realt-private-test-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify isolated audit and owner-only delivery guards
        run: python -m unittest discover -s realt_test -p 'test_*.py' -v
      - name: Verify no Cloudflare dependency in the live Realt path
        run: python -m compileall -q realt_test
