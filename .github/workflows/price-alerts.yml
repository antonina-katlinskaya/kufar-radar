name: Kufar price alerts

on:
  schedule:
    - cron: '10,25,40,55 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'notifications/price_alerts.py'
      - '.github/workflows/price-alerts.yml'

permissions:
  contents: read

concurrency:
  group: kufar-price-alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - name: Send via existing Kufar Radar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
        run: python -m notifications.price_alerts

