name: Kufar bridge branch test
on:
  push:
    branches:
      - fix/kufar-bridge-github-runner
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh Kufar bridge from GitHub runner
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BIR_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          KUFAR_PRIORITY_PROFILES: '11093294,11077002,11080367'
        run: node cloudflare-bridge/run.mjs
