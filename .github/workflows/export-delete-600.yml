name: Export DELETE 600

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-delete-600.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build DELETE 600 from current Kufar D1 snapshot
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
        run: |
          cat > /tmp/export_delete_600.py <<'PY'
          import csv, json, os, urllib.request
          from pathlib import Path

          account=os.environ['CF_ACCOUNT_ID']
          token=os.environ['CF_D1_API_TOKEN']
          db=os.environ['D1_DATABASE_ID']
          endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'

          sql = """
          WITH base AS (
            SELECT ad_id, profile_id, area, list_time, price_eur, url,
              COUNT(*) OVER (PARTITION BY area) AS group_count,
              ROW_NUMBER() OVER (
                PARTITION BY area
                ORDER BY COALESCE(list_time,'9999-12-31') ASC, ad_id ASC
              ) AS rn_oldest
            FROM kufar_ads_live
            WHERE profile_id='11093294' AND present=1
          ), scored AS (
            SELECT *,
              CASE
                WHEN group_count<=4 THEN group_count
                WHEN area<30 AND group_count<=9 THEN group_count
                WHEN area<30 AND group_count<=19 THEN 10
                WHEN area<30 AND group_count<=39 THEN 16
                WHEN area<30 AND group_count<=79 THEN 26
                WHEN area<30 THEN 40
                WHEN group_count<=9 THEN 4
                WHEN group_count<=19 THEN 5
                WHEN group_count<=39 THEN 8
                WHEN group_count<=79 THEN 12
                ELSE 20
              END AS keep_floor
            FROM base
          ), candidates AS (
            SELECT * FROM scored
            WHERE rn_oldest <= (group_count - keep_floor)
          )
          SELECT ad_id, area, list_time, price_eur, url, group_count, keep_floor, rn_oldest
          FROM candidates
          ORDER BY
            CASE WHEN area<30 THEN 1 ELSE 0 END ASC,
            group_count DESC,
            COALESCE(list_time,'9999-12-31') ASC,
            ad_id ASC
          LIMIT 600
          """

          req=urllib.request.Request(
            endpoint,
            data=json.dumps({'sql':sql}).encode(),
            headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},
            method='POST'
          )
          with urllib.request.urlopen(req, timeout=120) as r:
            payload=json.load(r)
          rows=payload['result'][0]['results']
          if len(rows)!=600:
            raise SystemExit(f'Expected 600 rows, got {len(rows)}')

          out=Path('exports')
          out.mkdir(exist_ok=True)
          fields=['order','ad_id','area','list_time','price_eur','group_count','keep_floor','url','reason']
          with (out/'DELETE_600_2026-10-07.csv').open('w',newline='',encoding='utf-8-sig') as f:
            w=csv.DictWriter(f,fieldnames=fields)
            w.writeheader()
            for i,row in enumerate(rows,1):
              w.writerow({
                'order':i,'ad_id':row['ad_id'],'area':row['area'],
                'list_time':row['list_time'],'price_eur':row['price_eur'],
                'group_count':row['group_count'],'keep_floor':row['keep_floor'],
                'url':row['url'],
                'reason':'массовый тип площади; старые первыми; редкие и площади <30 м² защищены'
              })

          by_area={}
          for row in rows:
            k=str(row['area']); by_area[k]=by_area.get(k,0)+1
          summary={
            'profile_id':'11093294',
            'selected':len(rows),
            'small_under_30':sum(1 for r in rows if r['area'] is not None and r['area']<30),
            'area_30_plus':sum(1 for r in rows if r['area'] is not None and r['area']>=30),
            'by_area':dict(sorted(by_area.items(),key=lambda kv:float(kv[0])))
          }
          (out/'DELETE_600_2026-10-07_summary.json').write_text(
            json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          print(json.dumps(summary,ensure_ascii=False))
          PY
          python /tmp/export_delete_600.py
      - name: Commit export
        run: |
          git config user.name 'kufar-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add exports/DELETE_600_2026-10-07.csv exports/DELETE_600_2026-10-07_summary.json
          git commit -m 'Export DELETE 600 for 2026-10-07'
          git push
