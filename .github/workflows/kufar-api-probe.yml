name: Kufar API probe
on:
  push:
    branches:
      - fix/kufar-bridge-github-runner
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe Kufar API from GitHub runner
        run: |
          node - <<'NODE'
          const url = new URL('https://cre-api.kufar.by/ads-search/v1/engine/v2/search/rendered-paginated');
          for (const [k,v] of Object.entries({atid:'11093294',lang:'ru',size:'45',typ:'sell',prn:'1000',sort:'lst.d'})) url.searchParams.set(k,v);
          const r = await fetch(url, {headers:{'User-Agent':'Mozilla/5.0'}});
          const text = await r.text();
          console.log('STATUS=' + r.status);
          console.log('CONTENT_TYPE=' + (r.headers.get('content-type') || ''));
          console.log(text.slice(0,500));
          if (!r.ok) process.exit(1);
          const data = JSON.parse(text);
          console.log('ADS=' + (Array.isArray(data.ads) ? data.ads.length : 'invalid'));
          console.log('TOTAL=' + data.total);
          NODE
