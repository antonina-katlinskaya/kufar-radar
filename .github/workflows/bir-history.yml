name: Bir history scan

on:
  workflow_dispatch:
  schedule:
    - cron: '2 * * * *'
    - cron: '17 * * * *'
    - cron: '32 * * * *'
    - cron: '47 * * * *'

permissions:
  contents: read

concurrency:
  group: bir-history-d1-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scan Bir.by and update existing D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BIR_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          BIR_SKIP_IF_FRESH_MINUTES: '10'
        run: node bir-history/run.mjs
