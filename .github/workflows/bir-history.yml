name: Bir history scan

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bir-history.yml', 'bir-history/run.mjs']
  workflow_dispatch:
  schedule:
    - cron: '2 * * * *'
    - cron: '17 * * * *'
    - cron: '32 * * * *'
    - cron: '47 * * * *'

permissions:
  contents: write

concurrency:
  group: bir-history-d1-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scan Bir.by and update existing D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BIR_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          BIR_SKIP_IF_FRESH_MINUTES: '10'
          BIR_EXPORT_META_PATH: /tmp/bir-successful-scan.json
        run: node bir-history/run.mjs
      - name: Checkout isolated Realt export tools
        uses: actions/checkout@v4
        with:
          ref: realt-private-test-20261026
          path: .realt-tools
          sparse-checkout: |
            realt_test
            radar/models.py
          persist-credentials: false
      - name: Export compact Bir snapshot for Realt
        continue-on-error: true
        env:
          PYTHONPATH: .realt-tools
          GITHUB_TOKEN: ${{ github.token }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          BIR_D1_DATABASE_ID: d8dd0219-8070-4f48-980d-312eba26209e
          BIR_EXPORT_META_PATH: /tmp/bir-successful-scan.json
        run: python -m realt_test.export_bir
